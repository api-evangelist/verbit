aid: verbit
name: VerbIT
description: >-
  Verbit is an AI-based transcription and captioning company whose platform pairs
  a state-of-the-art automatic speech recognition (ASR) engine with professional
  human review to deliver accurate transcripts and captions for legal, courtroom,
  media & entertainment, higher education, corporate, and government use cases.
  Verbit exposes a developer platform (Verbit Platform API v3) covering live
  booking and real-time captioning over WebSocket, post-production transcription
  jobs, a Caption Control API for managing live sessions, a Search API for
  indexing caption/transcript assets, and an Insights (Gen V) API that generates
  AI summaries, keywords, quizzes, and chapters. Authentication uses a short-lived
  JWT bearer token minted from a customer API key. Backed by HV Capital and
  Sapphire Ventures.
